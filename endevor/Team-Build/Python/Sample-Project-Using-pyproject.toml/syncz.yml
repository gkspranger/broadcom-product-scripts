---

# reassign variables set by syncz_vars.yml
host: ((.remote_host))      # required
user: ((.ssh_user))         # required
keyfile: ((.ssh_keyfile))   # required

# configs of files to sync from workstation to mainframe
sync:
  # ID of project files requiring ISO8859-1 to IBM-1047 conversion
  # USS expects (does best with) shell scripts to be encoded with IBM-1047
  - id: ci
    remote: ((.remote_home))/tbrocks
    ignore:
      - "*"                 # ignore everything
      - "!ci.sh"            # allow CI script
      - "!.python-version"  # allow Python version declaration

  # ID of project files requiring ISO8859-1 preservation
  # Python does best with source code that has been encoded with ISO8859-1
  - id: src
    remote: ((.remote_home))/tbrocks
    remoteencoding: ISO8859-1   # target encoding
    ignore:
      - "*"                 # ignore everything
      - "!pyproject.toml"   # allow project configuration file
      - "!README.md"        # allow primary doc
      - "!/src/"            # allow source code
      - "!/tests/"          # allow test code
      - "!tox.ini"          # allow test environment configuration file
      - "*/**/README.md"    # ignore sub docs
      - "*__pycache__*"     # ignore Python caching

# configs of files to sync from mainframe to workstation
backsync:
  # ID of project files to retrieve
  - id: arts
    local: build-out  # local directory to write to
    remote: ((.remote_home))/tbrocks/build-out  # remote directory to evaluate for retrieval
    binfiles:
      - "*.pax.Z"   # preserve remote encoding
    ignore:
      - "*"         # ignore everything
      - "!*.log"    # retrieve and convert (IBM-1047 to ISO8859-1) logs
      - "!*.pax.Z"  # retrieve Pax artifacts

# configs of combined actions (local and remote) to execute
tasks:
  # ID of build actions
  - name: build
    actions:
      # cleanup remote working directory before building artifact
      - remotecmd: |
          rm -fr ((.remote_home))/tbrocks
          mkdir -p ((.remote_home))/tbrocks/build-out/artifact
      # 1) syncz CI and SRC files (workstation to mainframe)
      # 2) set remote environment variable PIP_FIND_LINKS to known location of
      #    available Python packages
      # 3) execute build script
      # 4) retrieve and output CI results (*.log, *.pax.Z)
      - localcmd: |
          syncz --id-match "^(ci|src|arts)" \
          --ignore-host-key-check \
          -a """\
          src::\
          export PIP_FIND_LINKS=((.remote_pypi)) && \
          ./ci.sh build \&> build-out/build.log
          """
          cat build-out/build.log && grep -q "buildfinishedsuccessfully" build-out/build.log || exit 1
