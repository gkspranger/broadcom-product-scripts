[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tbrocks"
version = "0.0.1"
dependencies = [
  "click>=8.0,<9.0",
]
requires-python = ">=3.10,<3.13"
authors = [
  {name = "Greg Spranger", email = "greg.spranger@broadcom.com"},
]
description = "Example Python project, managed by Team Build."
readme = "README.md"
keywords = [
  "Team Build",
  "syncz",
  "bldz",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[project.optional-dependencies]
test = [
  "pytest>=9.0,<10.0",
  "tox>=4.0,<5.0",
]

[project.scripts]
tbrocks = "tbrocks.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tbrocks"]
